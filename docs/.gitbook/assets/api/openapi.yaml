openapi: 3.0.3
info:
  title: CiviForm API
  version: "1"
  description: |
    The stable, deployment-independent surface of the CiviForm HTTP JSON API.

    CiviForm is self-hosted by each jurisdiction, so the shape of the application answers
    depends on that jurisdiction's programs and questions. This document describes everything
    that is the same on every deployment: authentication, the applications list endpoint, its
    filters and pagination, the response envelope, the stable fields of every application record,
    the shape each question type takes inside the answers object, and the error responses.
    The exact answer schema for one program is generated by the running server and available
    to signed-in admins at `/docs/api/schemas/{programSlug}` (Swagger 2.0 or OpenAPI 3.0).
    Field-by-field prose, including every question type, is in the List applications page of
    this manual.

    Compatibility policy for `/api/v1`: additive only. New fields and parameters may appear;
    existing fields are never removed or retyped within v1.

    ## Authentication
    Requests use HTTP Basic authentication. The API key ID is the username and the key secret is
    the password. Keys are created by a CiviForm admin and carry, per program, a READ grant, a
    subnet allowlist (requests from other addresses are rejected), and an expiration. Every
    endpoint returns `401` with an empty body when the key is missing, retired, expired, used
    from an address outside its allowlist, or presented with a wrong secret.

    ## Reading applications
    `GET /admin/programs/{programSlug}/applications` returns submitted applications for one
    program, newest first, as pages. Filters apply to the submission time. Pages are linked by an
    opaque `nextPageToken`; the token is null on the last page. A token encodes the filters and
    page size of the request that produced it, so a follow-up request must either omit those
    parameters or repeat them unchanged.

    ## Revisions
    When an applicant edits and resubmits, CiviForm keeps the earlier application with
    `revision_state` `OBSOLETE` and creates a new one, with a new `application_id`, as `CURRENT`.
    The pair share `applicant_id` and `program_name`. Consumers that maintain a case per
    applicant should key the case on (`program_name`, `applicant_id`) and treat each
    `application_id` as a revision.

    ## Status
    `status`, `status_last_modified_time` and `application_note` reflect the program admin's
    latest action in CiviForm at the time of the request. Because the list filters on submission
    time, a status change made after submission is only observed by reading that application
    again. There is no endpoint for writing status.

    ## Files
    File upload answers contain `file_urls`, links to the admin file viewer on this deployment.
    Those links require an admin browser session; they cannot be fetched with an API key.
  contact:
    name: CiviForm Technical Support
    url: https://docs.civiform.us
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://{host}
    description: A CiviForm deployment
    variables:
      host:
        default: civiform.example.gov
        description: The deployment's hostname

security:
  - basicAuth: []

tags:
  - name: auth
    description: Key verification
  - name: applications
    description: Submitted applications

paths:
  /api/v1/checkAuth:
    get:
      tags: [auth]
      operationId: checkAuth
      summary: Verify an API key
      description: |
        Returns `200` with an empty body if the key authenticates: it exists, is not retired or
        expired, the request comes from an address inside the key's subnet allowlist, and the
        secret matches. Program grants are not checked here.
      responses:
        "200":
          description: The key is valid.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/programs/{programSlug}/applications:
    get:
      tags: [applications]
      operationId: listApplications
      summary: List submitted applications for a program
      description: |
        Returns one page of submitted applications for the program, newest first. The key must
        hold a READ grant for this program. Filters apply to `submit_time`. When `revisionState`
        is omitted both `CURRENT` and `OBSOLETE` applications are returned.
      parameters:
        - name: programSlug
          in: path
          required: true
          description: The program's URL slug, as shown in the admin UI and in the generated per-program API docs.
          schema:
            type: string
            example: rental-assistance
        - name: fromDate
          in: query
          required: false
          description: |
            Inclusive lower bound on `submit_time`. Accepts an ISO-8601 instant with zone
            (`2026-09-01T00:00:00Z`), a local date-time without zone (`2026-09-01T00:00:00`,
            interpreted in the deployment's configured time zone), or a date (`2026-09-01`,
            start of that day in the deployment's time zone).
          schema:
            type: string
            example: "2026-09-01T00:00:00Z"
        - name: toDate
          in: query
          required: false
          description: Exclusive upper bound on `submit_time`. Same formats as `fromDate`.
          schema:
            type: string
            example: "2026-10-01T00:00:00Z"
        - name: revisionState
          in: query
          required: false
          description: Return only applications in this revision state. Omit for both.
          schema:
            $ref: "#/components/schemas/RevisionState"
        - name: pageSize
          in: query
          required: false
          description: |
            Positive integer. Applications per page. When omitted, the deployment's configured
            maximum is used (default 1000). Larger values are not reduced in the current
            version; stay at or below 1000. Zero and negative values are not validated and
            fail with a server error today.
          schema:
            type: integer
            minimum: 1
            example: 200
        - name: nextPageToken
          in: query
          required: false
          description: |
            The `nextPageToken` from the previous page. Opaque and signed; do not construct or
            modify it. It carries the program, filters and page size of the request that produced
            it. A parameter the token already carries may be repeated only with the same value;
            a different value returns `400`. `fromDate`, `toDate` and `pageSize` may be omitted
            when following a token. `revisionState` must be repeated when the first request set
            it: omitting it is read as "both states" and returns `400` against a token that
            carries one. A filter the token does not carry may be added and is applied from that
            page on. Using a token against a different program returns `401` when the key lacks a
            grant there, otherwise `400`.
          schema:
            type: string
      responses:
        "200":
          description: One page of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationsPage"
              examples:
                firstPage:
                  $ref: "#/components/examples/ApplicationsPageExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: API key ID as the username, key secret as the password.

  responses:
    Unauthorized:
      description: |
        The key is missing, retired, expired, used from an address outside its subnet allowlist,
        presented with a wrong secret, or lacks a READ grant for the program. An unknown program
        slug also returns `401`, since no key can hold a grant for it. The body is empty.
    BadRequest:
      description: |
        A parameter failed validation. The body is a plain-text message. Cases include a
        malformed `fromDate` or `toDate`, an unrecognized `revisionState`, a program that is not
        an application program, a `nextPageToken` whose signature does not verify, a token
        issued for a different program that the key can read, and a token repeated with
        different `fromDate`, `toDate` or `pageSize` values. An unknown program slug returns
        `401`, not `400`, because the key cannot hold a grant for it.
      content:
        text/plain:
          schema:
            type: string
          examples:
            malformedDate:
              value: "Malformed query param: fromDate"
            tokenMismatch:
              value: "Request parameters must match pagination token: pageSize"
            tokenSignature:
              value: "Page token signature invalid"
            badRevisionState:
              value: "Invalid revision state parameter: LATEST"

  schemas:
    RevisionState:
      type: string
      enum: [CURRENT, OBSOLETE]
      description: |
        `CURRENT` is the applicant's latest submission for the program. `OBSOLETE` is an earlier
        submission that a later one replaced.

    ApplicationsPage:
      type: object
      required: [payload, nextPageToken]
      properties:
        payload:
          type: array
          description: Applications, newest first.
          items:
            $ref: "#/components/schemas/Application"
        nextPageToken:
          type: string
          nullable: true
          description: Pass as `nextPageToken` to fetch the next page. Null on the last page.

    Application:
      type: object
      description: |
        One submitted application. The stable fields below are present on every deployment.
        `application` holds the answers, keyed by question admin name; its per-program schema is
        generated by the server. Additional top-level fields may appear when a deployment enables
        answer scoring.
      required:
        - program_name
        - program_version_id
        - applicant_id
        - application_id
        - language
        - create_time
        - submitter_type
        - ti_email
        - ti_organization
        - submit_time
        - revision_state
        - status
        - application_note
        - status_last_modified_time
        - application
      properties:
        program_name:
          type: string
          description: The program's admin name. Stable across program versions.
          example: rental_assistance
        program_version_id:
          type: integer
          format: int64
          description: Internal ID of the program version the application was submitted against. Changes when the program is edited and republished.
        applicant_id:
          type: integer
          format: int64
          description: Internal ID of the applicant account. Shared by all of that applicant's applications and revisions.
        application_id:
          type: integer
          format: int64
          description: Internal ID of this application revision. Unique per deployment; use it as the idempotency key.
        language:
          type: string
          description: BCP 47 language tag the applicant used.
          example: en-US
        create_time:
          type: string
          format: date-time
          description: When the application was started, ISO-8601 with millisecond precision and the deployment's UTC offset.
          example: "2026-09-14T09:12:33.284-04:00"
        submitter_type:
          type: string
          enum: [APPLICANT, TRUSTED_INTERMEDIARY]
          description: Whether the applicant submitted directly or a trusted intermediary submitted on their behalf.
        ti_email:
          type: string
          nullable: true
          description: Email of the trusted intermediary who submitted. Null when `submitter_type` is `APPLICANT`.
        ti_organization:
          type: string
          nullable: true
          description: Trusted intermediary organization name. Null when `submitter_type` is `APPLICANT` or the intermediary has no organization.
        submit_time:
          type: string
          format: date-time
          nullable: true
          description: When the application was submitted, ISO-8601 with offset. Filters apply to this field.
          example: "2026-09-14T09:31:02-04:00"
        revision_state:
          $ref: "#/components/schemas/RevisionState"
        status:
          type: string
          nullable: true
          description: The status a program admin last set in CiviForm, by its configured name. Null when none has been set.
          example: Approved
        application_note:
          type: string
          nullable: true
          description: The note a program admin last attached in CiviForm. Null when none.
        status_last_modified_time:
          type: string
          format: date-time
          nullable: true
          description: When `status` was last changed. Null when no status has been set.
        application:
          $ref: "#/components/schemas/Answers"
        total_score:
          type: number
          nullable: true
          description: |
            Present only when the deployment enables answer-option scoring. The application's
            total score, or null when scoring was not applied to this application.
      additionalProperties: true

    Answers:
      type: object
      description: |
        Answers keyed by question admin name (lowercase, underscores for spaces). Each value is an
        object with a `question_type` and the fields for that type, listed below. Questions the
        applicant did not answer are present with null values. Questions inside an enumerator
        appear nested inside each entity of the enumerator's `entities` array rather than at the
        top level. The exact keys for one program are in that deployment's generated schema.
      additionalProperties:
        $ref: "#/components/schemas/Answer"

    Answer:
      type: object
      required: [question_type]
      properties:
        question_type:
          type: string
          enum:
            - ADDRESS
            - CURRENCY
            - DATE
            - EMAIL
            - ENUMERATOR
            - FILE_UPLOAD
            - ID
            - MAP
            - MULTI_SELECT
            - NAME
            - NUMBER
            - PHONE
            - SINGLE_SELECT
            - TEXT
      additionalProperties: true
      description: |
        Fields by `question_type`:

        | question_type | Fields |
        |---|---|
        | ADDRESS | `street`, `line2`, `city`, `state`, `zip` (strings); `corrected` (string, the address-correction outcome); `latitude`, `longitude` (strings), `well_known_id` (string) when the deployment corrects addresses; `service_area` (string, comma-separated `id_state_timestamp` entries) when service-area validation is configured |
        | CURRENCY | `currency_dollars` (number, dollars with cents as the fraction) |
        | DATE | `date` (string, `YYYY-MM-DD`) |
        | EMAIL | `email` (string) |
        | ENUMERATOR | `entities` (array of objects). Each entity has `entity_name` (string) plus one key per repeated question, each an Answer object |
        | FILE_UPLOAD | `file_urls` (array of strings). Admin-only URLs on this deployment; not fetchable with the API key |
        | ID | `id` (string) |
        | MAP | `selections` (array of strings, selected location IDs) |
        | MULTI_SELECT | `selections` (array of strings, option admin names); `scores` (array of numbers, or null) only when the deployment enables answer-option scoring |
        | NAME | `first_name`, `middle_name`, `last_name`, `suffix` (strings) |
        | NUMBER | `number` (integer) |
        | PHONE | `phone_number` (string, E.164) |
        | SINGLE_SELECT | `selection` (string, option admin name) |
        | TEXT | `text` (string) |

  examples:
    ApplicationsPageExample:
      summary: First page of two applications, more pages available
      value:
        payload:
          - program_name: rental_assistance
            program_version_id: 412
            applicant_id: 9031
            application_id: 22817
            language: en-US
            create_time: "2026-09-14T09:12:33-04:00"
            submitter_type: APPLICANT
            ti_email: null
            ti_organization: null
            submit_time: "2026-09-14T09:31:02-04:00"
            revision_state: CURRENT
            status: Approved
            application_note: "Verified income documents."
            status_last_modified_time: "2026-09-16T14:02:10-04:00"
            application:
              applicant_name:
                question_type: NAME
                first_name: Dana
                middle_name: null
                last_name: Reyes
                suffix: null
              applicant_address:
                question_type: ADDRESS
                street: 100 Main St
                line2: Apt 4
                city: Charlotte
                state: NC
                zip: "28202"
                corrected: Corrected
                latitude: "35.2271"
                longitude: "-80.8431"
                well_known_id: "4326"
                service_area: null
              monthly_rent:
                question_type: CURRENCY
                currency_dollars: 1450.5
              household_members:
                question_type: ENUMERATOR
                entities:
                  - entity_name: Sam
                    household_member_dob:
                      question_type: DATE
                      date: "2014-03-09"
              proof_of_income:
                question_type: FILE_UPLOAD
                file_urls:
                  - https://civiform.example.gov/admin/applicant-files/program-412%2Fapplicant-9031%2Fpaystub.pdf
          - program_name: rental_assistance
            program_version_id: 412
            applicant_id: 9031
            application_id: 22640
            language: en-US
            create_time: "2026-09-10T16:40:07-04:00"
            submitter_type: APPLICANT
            ti_email: null
            ti_organization: null
            submit_time: "2026-09-10T16:55:49-04:00"
            revision_state: OBSOLETE
            status: null
            application_note: null
            status_last_modified_time: null
            application:
              applicant_name:
                question_type: NAME
                first_name: Dana
                middle_name: null
                last_name: Reyes
                suffix: null
        nextPageToken: "eyJwYXlsb2FkIjoie1wicGFnZVNwZWNcIjp7...}"
